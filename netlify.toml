# Netlify hosts the frontend only. The Python backend cannot run here - Netlify
# Functions are JavaScript and Go - so it runs on Render and this file proxies
# to it. See docs/DEPLOY.md and render.yaml.

[build]
  base = "frontend"
  command = "npm run build"
  # Relative to `base`, so this resolves to frontend/dist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
#  The backend host is hard-coded here on purpose: Netlify does no environment
#  variable substitution in redirects, so this line is edited by hand whenever
#  the Render service URL changes.
#
#  status = 200 makes this a proxy rather than a redirect: Netlify fetches the
#  backend server-side and returns the response as its own, so the browser sees
#  everything on one origin. No CORS check is involved and the backend URL
#  never reaches the client.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://vision-api-mdq2.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: every other path serves the same document.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The app has no frames, forms or plugins of its own.
    X-Frame-Options = "DENY"

# Vite fingerprints these filenames, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
